<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="售后问题反馈工作台 — 自动保存、截图即贴、一键成稿">
<meta name="color-scheme" content="light dark">
<title>售后反馈工作台</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext y='72' x='50' text-anchor='middle' font-size='58'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">📋</span>
    <span>售后反馈工作台</span>
    <small id="recordCount"></small>
  </div>

  <div class="spacer"></div>

  <div class="save-state" id="saveState"><span class="dot"></span><span>已保存</span></div>

  <button class="btn" id="btnNew" title="新建一条记录">＋ 新建</button>
  <button class="btn" id="btnExport" title="导出备份文件">导出</button>
  <button class="btn" id="btnImport" title="从备份文件恢复">导入</button>
</header>

<nav class="tabs" id="tabs"></nav>

<main class="layout">

  <section class="card">
    <div class="card-head">
      <h2 id="formTitle">内部售后问题反馈</h2>
      <span class="spacer"></span>
      <button class="btn sm danger" id="btnClearForm">清空本页</button>
    </div>
    <div class="card-body">
      <div id="form"></div>
    </div>
  </section>

  <aside class="side">

    <div class="card">
      <div class="card-head">
        <h2>成稿预览</h2>
        <span class="spacer"></span>
        <button class="btn sm" id="btnCopyText" title="只复制文字，收件人可以选中复制">复制文字</button>
        <button class="btn sm primary" id="btnCopyRich" title="把文字和全部截图合成一张长图复制到剪贴板，粘贴一次即可">复制图文</button>
        <button class="btn sm" id="btnSaveImg" title="把文字和截图合成一张长图保存到本地">长图</button>
      </div>
      <pre class="preview empty" id="preview">开始填写左侧内容，这里会自动生成可以粘贴到群里的文本。</pre>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>历史记录</h2>
        <span class="spacer"></span>
        <span class="hint" id="histCount" style="font-size:11.5px;color:var(--faint)"></span>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="搜索客户 / 门店 / 现象关键词…">
      </div>
      <div class="history-list" id="history"></div>
    </div>

  </aside>

</main>

<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose">✕</button>
  <button class="nav prev" id="lbPrev">‹</button>
  <button class="nav next" id="lbNext">›</button>
  <img id="lbImg" alt="">
  <div class="cap" id="lbCap"></div>
</div>

<div id="toast"></div>

<input type="file" id="filePicker" accept="image/*" multiple hidden>
<input type="file" id="jsonPicker" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
